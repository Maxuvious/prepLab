<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepLab Interactive Map - WIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #f3f4f6;
      --text: #111827;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #eab308;
      --success: #22c55e;
      --mauve: #a78bfa;
      --surface: #ffffff;
      --shadow: rgba(0,0,0,0.1);
      --border: #d1d5db;
      --muted: #6b7280;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
    }
    .bg-gray-100 {
      background-color: var(--bg);
    }
    .bg-white {
      background-color: var(--surface);
    }
    .shadow-md {
      box-shadow: 0 4px 6px -1px var(--shadow);
    }
    .bg-blue-500 {
      background-color: var(--primary);
    }
    .hover\:bg-blue-600:hover {
      background-color: color-mix(in oklab, var(--primary), black 10%);
    }
    .bg-red-500 {
      background-color: var(--danger);
    }
    .hover\:bg-red-600:hover {
      background-color: color-mix(in oklab, var(--danger), black 10%);
    }
    .text-white {
      color: var(--text);
    }
    .text-gray-900 {
      color: var(--text);
    }
    .text-gray-500 {
      color: var(--muted);
    }
    .border {
      border-color: var(--border);
    }
    .border-gray-300 {
      border-color: var(--border);
    }
    /* Add more overrides as needed */
  </style>
</head>
<body class="font-sans p-4">
  <div id="main">
    <h1 class="text-3xl font-bold text-center mb-4">Interactive Map (Work in Progress)</h1>
    <button id="logoutBtn" class="bg-red-500 text-white p-2 rounded hover:bg-red-600 mb-4">Logout</button>
    <p class="text-center">This feature is currently under development.</p>
  </div>
  <script type="module">
    import { token, role } from './auth.js';
    if (!token || role === 'root') {
      window.location.href = '/';
    }
    async function loadTheme() {
      try {
        const res = await fetch('/api/theme');
        const { colors } = await res.json();
        for (const [key, value] of Object.entries(colors)) {
          document.documentElement.style.setProperty(key, value);
        }
      } catch (err) {
        console.error('Failed to load theme', err);
      }
    }
    loadTheme();
    document.getElementById('logoutBtn').onclick = () => {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/';
    };
  </script>
</body>
</html>
