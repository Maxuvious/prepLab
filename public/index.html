<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepLab Cards - Test Version</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .item-list { list-style: none; padding-left: 1em; }
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans p-4">
  <div id="login" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">Login (Test Mode)</h2>
    <input id="user" placeholder="Username" class="w-full p-2 mb-2 border rounded" />
    <input id="pass" type="password" placeholder="Password" class="w-full p-2 mb-2 border rounded" />
    <button id="loginBtn" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Login</button>
    <p id="loginError" class="text-red-500 mt-2 hidden">Login failed. Please check your credentials.</p>
  </div>
  <div id="main" class="hidden">
    <h1 id="title" class="text-3xl font-bold text-center mb-4">PrepLab Cards</h1>
    <input type="text" id="search" placeholder="Search by class..." class="w-full max-w-md mx-auto p-2 mb-4 border rounded" />
    <div id="cards" class="grid gap-4 max-w-4xl mx-auto"></div>
  </div>

  <script type="module">
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('DOM loaded - Test version started');
      let token = localStorage.getItem('token') || '';
      let role = localStorage.getItem('role') || '';

      async function handleLogin() {
        const username = document.getElementById('user').value.trim();
        const password = document.getElementById('pass').value;
        const loginError = document.getElementById('loginError');
        const loginDiv = document.getElementById('login');

        if (!username || !password) {
          loginError.textContent = 'Username and password are required';
          loginError.classList.remove('hidden');
          return;
        }

        console.log('Login attempt:', username); // Debug - password not logged for security
        loginError.classList.add('hidden');
        loginDiv.classList.add('loading');
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            body: JSON.stringify({ username, password }),
            headers: { 'Content-Type': 'application/json' },
          });

          if (!res.ok) {
            const errorData = await res.json();
            throw new Error(errorData.error || 'Login failed');
          }

          const data = await res.json();
          token = data.token;
          role = data.role;
          localStorage.setItem('token', token);
          localStorage.setItem('role', role);
          console.log('Login success - role:', role);

          document.getElementById('login').classList.add('hidden');
          document.getElementById('main').classList.remove('hidden');

          if (role === 'root') {
            window.location.href = '/admin.html';
          } else {
            const { loadCards } = await import('./cards.js');
            loadCards();
          }
        } catch (err) {
          console.error('Login error:', err.message);
          loginError.textContent = err.message;
          loginError.classList.remove('hidden');
        } finally {
          loginDiv.classList.remove('loading');
        }
      }

      document.getElementById('loginBtn').addEventListener('click', (e) => {
        console.log('Login button clicked');
        handleLogin();
      });

      document.getElementById('pass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          console.log('Enter key pressed');
          handleLogin();
        }
      });

      document.getElementById('search').addEventListener('input', async (e) => {
        const value = e.target.value.toLowerCase();
        const { renderCards } = await import('./cards.js');
        renderCards(value);
      });

      if (localStorage.getItem('token')) {
        console.log('Token found, loading main');
        document.getElementById('login').classList.add('hidden');
        document.getElementById('main').classList.remove('hidden');
        const { loadCards } = await import('./cards.js');
        loadCards();
      }
    });
  </script>
</body>
</html>
