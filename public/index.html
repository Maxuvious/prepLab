<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepLab Cards</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 1em; background: #f5f5f5; }
    #search { width: 100%; padding: 0.5em; margin-bottom: 1em; }
    .card { background: #fffbe6; border: 1px solid #ccc; border-radius: 4px; box-shadow: 2px 2px 6px rgba(0,0,0,0.1); margin-bottom: 1em; padding: 1em; }
    .card h3 { margin-top: 0; }
    .item-list { list-style: none; padding-left: 1em; }
  </style>
</head>
<body>
  <div id="login">
    <input id="user" placeholder="username" />
    <input id="pass" type="password" placeholder="password" />
    <button id="loginBtn">Login</button>
  </div>
  <h1 style="display:none" id="title">PrepLab Cards</h1>
  <input type="text" id="search" placeholder="Search by class..." style="display:none" />
  <div id="cards"></div>

  <script type="module">
    let allCards = [];
    let token = '';
    let socket;

    async function login() {
      const username = document.getElementById('user').value;
      const password = document.getElementById('pass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
        headers: { 'Content-Type': 'application/json' },
      });
      if (!res.ok) return alert('login failed');
      const data = await res.json();
      token = data.token;
      document.getElementById('login').style.display = 'none';
      document.getElementById('title').style.display = 'block';
      document.getElementById('search').style.display = 'block';
      connectWS();
      loadCards();
    }

    async function loadCards() {
      const res = await fetch('/api/cards?items=1', {
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      });
      allCards = await res.json();
      renderCards(allCards);
    }

    function connectWS() {
      socket = new WebSocket(`ws://${location.host}/ws`);
      socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'reset') return loadCards();
        const t = document.querySelector(`[data-task="${msg.taskId}"]`);
        if (t) {
          t.checked = msg.checked;
          t.parentElement.style.background = msg.color;
          t.parentElement.title = `Checked by ${msg.user}`;
        }
      };
    }

    function renderCards(cards) {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      for (const card of cards) {
        const div = document.createElement('div');
        div.className = 'card';
        const title = document.createElement('h3');
        title.textContent = card.class;
        const text = document.createElement('p');
        text.textContent = card.card_text;
        const ul = document.createElement('ul');
        ul.className = 'item-list';
        for (const task of card.tasks) {
          const li = document.createElement('li');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.task = task.id;
          cb.checked = task.is_checked;
          if (task.color) {
            li.style.background = task.color;
            li.title = `Checked by ${task.username}`;
          }
          cb.addEventListener('change', async () => {
            await fetch('/api/tasks/check', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({ taskId: task.id, checked: cb.checked })
            });
          });
          li.appendChild(cb);
          li.appendChild(document.createTextNode(' ' + task.description));
          ul.appendChild(li);
        }
        div.appendChild(title);
        div.appendChild(text);
        div.appendChild(ul);
        container.appendChild(div);
      }
    }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('search').addEventListener('input', (e) => {
      const value = e.target.value.toLowerCase();
      const filtered = allCards.filter(c => c.class.toLowerCase().includes(value));
      renderCards(filtered);
    });
  </script>
</body>
</html>
